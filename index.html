<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La 87, La Primera</title>

  <style>
    /* Reset + base */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #000;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    /* Fondo dinámico */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('https://i.postimg.cc/NFC91t6M/fondo-radio.jpg') center/cover no-repeat;
      animation: zoomPan 20s linear infinite;
    }
    @keyframes zoomPan {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(3%); }
      100% { transform: scale(1) translateY(0); }
    }
    /* Overlay decorativo (no deformar) */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Top bar en vivo */
    .topbar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      padding: 6px 10px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .badge-live {
      background: #e30000;
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Layout principal */
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px clamp(12px, 4vw, 24px) 40px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .logo {
      width: clamp(120px, 25vw, 240px);
      margin: 8px auto 0 auto;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    .hero {
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 700;
      margin: 8px 0 6px 0;
    }
    .track {
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      opacity: 0.95;
      min-height: 1.6em;
    }

    /* Equalizador (se “activa” cuando está reproduciendo) */
    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 4px;
      height: 28px;
      margin: 10px 0 6px 0;
    }
    .eq-bar {
      width: 4px;
      background: #0a6cff;
      height: 12px;
      transform-origin: bottom;
      animation: eqBounce 1s ease-in-out infinite;
      animation-play-state: paused; /* por defecto pausado */
      border-radius: 2px;
    }
    .equalizer.playing .eq-bar { animation-play-state: running; }
    .eq-bar:nth-child(1) { animation-delay: 0s; }
    .eq-bar:nth-child(2) { animation-delay: .1s; }
    .eq-bar:nth-child(3) { animation-delay: .2s; }
    .eq-bar:nth-child(4) { animation-delay: .3s; }
    .eq-bar:nth-child(5) { animation-delay: .4s; }
    @keyframes eqBounce {
      0%,100% { transform: scaleY(1); }
      50%     { transform: scaleY(2.2); }
    }

    /* Player */
    .player {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 16px;
    }
    .disc-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }
    .disc {
      width: clamp(120px, 28vw, 200px);
      height: clamp(120px, 28vw, 200px);
      border-radius: 50%;
      border: 8px solid #001f4d;
      background: #006aff;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .disc img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: spin 6s linear infinite;
      animation-play-state: paused; /* pausado si no está en play */
    }
    .disc.playing img { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .play-btn {
      position: absolute;
      bottom: -10%;
      left: 50%;
      transform: translate(-50%, 0);
      width: clamp(56px, 10vw, 80px);
      height: clamp(56px, 10vw, 80px);
      border-radius: 50%;
      background: #006aff;
      border: 8px solid #001f4d;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      user-select: none;
    }
    .icon {
      display: grid;
      place-items: center;
    }
    .icon.play { /* triángulo */
      width: 0;
      height: 0;
      border-left: 24px solid #fff;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
    }
    .icon.pause {
      display: grid;
      grid-auto-flow: column;
      gap: 8px;
    }
    .bar {
      width: 8px; height: 30px; background: #fff; border-radius: 2px;
    }

    /* Botonera inferior (timer y volumen) */
    .bottom-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: grid; place-items: center;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .btn-icon img {
      width: 24px; height: 24px; object-fit: contain;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    }

    .volume-wrap {
      display: none; /* toggle via JS */
      width: 160px;
      margin: -4px auto 0 auto;
    }
    .volume {
      width: 100%;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.9);
      outline: none;
    }
    .volume::-webkit-slider-thumb {
      appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #006aff; border: 2px solid #001f4d;
      margin-top: -6px;
    }
    .volume::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #006aff; border: 2px solid #001f4d;
    }

    /* Redes sociales */
    .social {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }
    .social a {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: grid; place-items: center;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    .social img { width: 26px; height: 26px; object-fit: contain; }

    /* Responsivo */
    @media (min-width: 720px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Accesibilidad / motion */
    @media (prefers-reduced-motion: reduce) {
      .bg { animation: none; }
      .disc img { animation: none; }
      .equalizer .eq-bar { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Audio -->
  <audio id="radio-player"
    preload="none"
    src="https://stream.zeno.fm/tr4u2w53sxhvv"
    aria-label="Streaming La 87 La Primera">
  </audio>

  <!-- Fondo + overlay -->
  <div class="bg" aria-hidden="true"></div>
  <img class="overlay" src="https://i.postimg.cc/tRB2rVD1/Picsart-25-06-28-13-33-48-987.png" alt="" aria-hidden="true"/>

  <!-- Topbar -->
  <div class="topbar">
    <span class="badge-live" aria-live="polite">EN VIVO</span>
  </div>

  <!-- Contenido -->
  <main class="container">
    <img class="logo" src="/img/laprimera_logo_trans512.png" alt="La 87 La Primera - Logo"/>

    <section class="hero" aria-label="Información de transmisión">
      <div class="equalizer" id="eq">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
      <h1>La 87 En Vivo</h1>
      <p class="track" id="track-info">Cargando canción...</p>
    </section>

    <section class="player" aria-label="Controles de reproducción">
      <div class="disc-wrap">
        <div class="disc" id="disc">
          <img src="/img/laprimera_logo_trans512.png" alt="Carátula/Logo en disco"/>
        </div>

        <!-- Botón play/pause (toggled por JS) -->
        <button class="play-btn" id="play-toggle" aria-label="Reproducir" aria-pressed="false">
          <span class="icon play" id="icon-play" aria-hidden="true"></span>
          <span class="icon pause" id="icon-pause" aria-hidden="true" style="display:none;">
            <span class="bar"></span><span class="bar"></span>
          </span>
        </button>
      </div>

      <!-- Acciones secundarias -->
      <div class="bottom-actions">
        <div class="btn-icon" title="Temporizador" aria-label="Temporizador">
          <img src="https://i.postimg.cc/sgdVszMr/images-2025-06-28-T150103-819.png" alt="Temporizador">
        </div>
        <div class="btn-icon" id="btn-volume" title="Volumen" aria-controls="volume-slider" aria-expanded="false">
          <img src="https://i.postimg.cc/QCT3ZKm3/6-1.png" alt="Control de volumen">
        </div>
      </div>

      <!-- Slider volumen (toggle) -->
      <div class="volume-wrap" id="vol-wrap">
        <input id="volume-slider" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volumen">
      </div>
    </section>

    <!-- Redes sociales -->
    <nav class="social" aria-label="Redes sociales">
      <a href="https://web.facebook.com/la87laprimera" target="_blank" rel="noopener" title="Facebook">
        <img src="https://i.postimg.cc/JtS4C0pk/facebook.png" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/la87laprimera/" target="_blank" rel="noopener" title="Instagram">
        <img src="https://i.postimg.cc/4YQJc5s6/instagram.png" alt="Instagram">
      </a>
      <a href="https://wa.me/50432639354?text=Saludos,%20los%20escucho%20en%20" target="_blank" rel="noopener" title="WhatsApp">
        <img src="https://i.postimg.cc/B8h4Yn8t/whatsapp.png" alt="WhatsApp">
      </a>
    </nav>
  </main>

  <!-- Streaming + Metadata Zeno -->
  <script>
    const player = document.getElementById('radio-player');
    const playBtn = document.getElementById('play-toggle');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const disc = document.getElementById('disc');
    const eq = document.getElementById('eq');

    const volBtn = document.getElementById('btn-volume');
    const volWrap = document.getElementById('vol-wrap');
    const volSlider = document.getElementById('volume-slider');

    // Toggle volumen
    volBtn.addEventListener('click', () => {
      const visible = volWrap.style.display === 'block';
      volWrap.style.display = visible ? 'none' : 'block';
      volBtn.setAttribute('aria-expanded', String(!visible));
    });
    volSlider.addEventListener('input', () => { player.volume = volSlider.value; });

    // Play/Pause UX
    function setPlayingState(isPlaying) {
      playBtn.setAttribute('aria-pressed', String(isPlaying));
      iconPlay.style.display  = isPlaying ? 'none' : 'block';
      iconPause.style.display = isPlaying ? 'grid' : 'none';
      disc.classList.toggle('playing', isPlaying);
      eq.classList.toggle('playing', isPlaying);
    }

    playBtn.addEventListener('click', async () => {
      try {
        if (player.paused) {
          await player.play();
          setPlayingState(true);
        } else {
          player.pause();
          setPlayingState(false);
        }
      } catch (e) {
        console.warn('Reproducción bloqueada por el navegador:', e);
      }
    });

    // Autoplay "best effort": algunos navegadores lo bloquearán sin interacción
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await player.play();
        setPlayingState(true);
      } catch {
        setPlayingState(false);
      }
    });

    // === Zeno Metadata (SSE con fallback) ===
    const trackInfoEl = document.getElementById('track-info');
    const ZENO_SSE = "https://api.zeno.fm/mounts/metadata/subscribe/ftkpyw53sxhvv";

    function setTrack(text) {
      if (text && typeof text === 'string') {
        trackInfoEl.textContent = text;
      }
    }

    // Preferimos EventSource (SSE)
    try {
      const source = new EventSource(ZENO_SSE, { withCredentials: false });
      source.onopen = () => console.log('Conectado a Zeno SSE');
      source.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          const title = data?.now_playing?.title || data?.streamTitle || ev.data || 'Transmitiendo...';
          setTrack(title);
        } catch {
          setTrack(ev.data || 'Transmitiendo...');
        }
      };
      source.onerror = (err) => {
        console.warn('SSE error, intento fallback fetch stream', err);
        source.close();
        startFetchFallback();
      };
    } catch (e) {
      console.warn('SSE no soportado, uso fallback fetch', e);
      startFetchFallback();
    }

    async function startFetchFallback() {
      try {
        const res = await fetch(ZENO_SSE);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // conserva el trozo incompleto
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const json = JSON.parse(line);
              const title = json?.now_playing?.title || json?.streamTitle || 'Transmitiendo...';
              setTrack(title);
            } catch {
              setTrack(line);
            }
          }
        }
      } catch (err) {
        console.error('No se pudo cargar metadata Zeno:', err);
        setTrack('Sin conexión con API Zeno');
      }
    }
  </script>
</body>
</html>
