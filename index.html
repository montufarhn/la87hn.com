<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>La 87, La Primera — 87.7 FM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(-45deg,#f1c40f,#22c55e,#0ea5e9,#fb923c);
      background-size:400% 400%;
      animation:grad 16s ease infinite;
      font-family:Inter,system-ui,sans-serif;
      color:#fff;
    }
    @keyframes grad{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    .card-wrap{
      width:94%;
      max-width:680px;
      background:rgba(0,0,0,0.45);
      border-radius:14px;
      padding:18px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
    }
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
    .brand img{height:64px}
    .station{font-weight:700;font-size:1.25rem}
    .freq{color:#ffd700;font-weight:800}
    .center{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
    .cover{
      width:220px;
      height:220px;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,0.5);
    }
    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition: opacity 0.7s ease-in-out;
      opacity:1;
    }
    .cover img.fade-out{
      opacity:0;
    }
    .title{font-size:1.05rem;font-weight:700;width:100%;text-align:center;overflow:hidden}
    .title.marquee span{
      display:inline-block;
      padding-left:100%;
      animation: marqueeAnim linear infinite;
      white-space:nowrap;
    }
    @keyframes marqueeAnim{
      0%{transform:translateX(0%);}
      100%{transform:translateX(-100%);}
    }
    .artist{color:rgba(255,255,255,0.85);font-size:0.95rem;text-align:center}
    .controls{display:flex;gap:10px;align-items:center}
    .play-btn{background:linear-gradient(90deg,#ffd700,#fb923c);border:0;padding:10px 18px;border-radius:999px;font-weight:800;cursor:pointer}
    .mute{background:transparent;border:1px solid rgba(255,255,255,0.08);padding:8px;border-radius:8px;cursor:pointer}
    .sponsors-title{font-weight:700;font-size:1.25rem;text-align:center;margin-top:16px;margin-bottom:4px}
    .social-links{display:flex;justify-content:center;gap:20px;margin-top:16px}
    .social-links a{
      color:#fff;
      text-decoration:none;
      font-size:1.6rem;
      transition:opacity .2s ease;
    }
    .social-links a:hover{opacity:0.7}
    .footer-copyright{
      font-size:0.8rem;
      color:rgba(255,255,255,0.7);
      text-align:center;
      margin-top:16px;
    }
    .footer-copyright a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .footer-copyright a:hover {
      text-decoration: underline;
    }
    .carousel img{max-height:300px;object-fit:contain}
    .app-stores { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 20px; }
    .app-stores a img { height: 45px; transition: opacity 0.2s ease; }
    .app-stores a:hover img { opacity: 0.8; }


    #visualizer{
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      z-index:-1;
    }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <div class="card-wrap">
    <div class="brand">
      <img src="https://www.la87hn.com/assets/laprimera_logo_trans512.png" alt="La 87 Logo">
      <div>
        <div class="station">La 87, La Primera <span class="freq">87.7 FM</span></div>
        <div style="font-size:.9rem;color:rgba(255,255,255,0.85)">Desde El Progreso, Yoro</div>
      </div>
    </div>

    <div class="center">
      <div class="cover" id="coverBox"><img id="coverImg" src="https://www.la87hn.com/assets/laprimera_logo_trans512.png" alt="Carátula"></div>
      <div class="title" id="songTitle">Sonando En Vivo</div>
      <div class="artist" id="songArtist">La 87, La Primera — 87.7 FM</div>

      <div class="controls">
        <button id="playPause" class="play-btn">⏯️ Reproducir</button>
        <button id="muteBtn" class="mute">🔊</button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" style="width:140px">
      </div>

      <audio id="audio" crossorigin="anonymous" preload="none"></audio>

      <div class="sponsors-title">Anúnciate con nosotros</div>
      <div id="sponsorCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" style="width:100%;max-width:520px">
        <div class="carousel-inner text-center">
          <div class="carousel-item active"><img src="https://www.la87hn.com/assets/sponsors/patrocinador2.png" class="d-block mx-auto" alt="Multiservicios NyG"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador3.png" class="d-block mx-auto" alt="Volando Lengua Podcast"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador4.png" class="d-block mx-auto" alt="Biografias"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador5.png" class="d-block mx-auto" alt="Biografias"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador7.png" class="d-block mx-auto" alt="Fibranet"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador8.png" class="d-block mx-auto" alt="Fibranet"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador9.png" class="d-block mx-auto" alt="Anunciate con nosotros"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador10.png" class="d-block mx-auto" alt="Anunciate con nosotros"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador11.png" class="d-block mx-auto" alt="Anunciate con nosotros"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador12.png" class="d-block mx-auto" alt="Anunciate con nosotros"></div>
          <div class="carousel-item"><img src="https://www.la87hn.com/assets/sponsors/patrocinador13.png" class="d-block mx-auto" alt="Anunciate con nosotros"></div>
        </div>
      </div>

      <div class="app-stores">
        <a href="https://play.google.com/store/apps/details?id=com.la87hn.la87laprimera&hl=en" target="_blank" rel="noopener noreferrer" title="Descargar en Google Play">
          <img src="https://play.google.com/intl/en_us/badges/static/images/badges/es-419_badge_web_generic.png" alt="Disponible en Google Play">
        </a>
        <a href="https://music.apple.com/hn/station/la-87-la-primera/ra.1833557589?l=en-GB" target="_blank" rel="noopener noreferrer" title="Escuchar en Apple Music">
          <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Escuchar en Apple Music">
        </a>
      </div>

      <div class="social-links">
        <!-- Reemplaza '#' con tus URLs de redes sociales -->
        <a href="https://www.facebook.com/la87laprimera" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="https://www.instagram.com/la87laprimera" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://x.com/la87fm" target="_blank" title="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
        <a href="https://wa.me/50432639354?text=Hola,%20quiero%20enviar%20mis%20saludos" target="_blank" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
        <a href="#" target="_blank" title="TikTok"><i class="bi bi-tiktok"></i></a>
      </div>

      <div class="footer-copyright">
        &copy; Derechos Reservados <span id="copyright-year"></span> | <a href="https://la87hn.com/" target="_blank" rel="noopener noreferrer">La 87, La Primera</a>
      </div>
    </div>
  </div>
    
    

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (async function(){

    const STREAM = 'https://stream.zeno.fm/tr4u2w53sxhvv';
    const ZENO_META = 'https://api.zeno.fm/mounts/metadata/subscribe/ftkpyw53sxhvv';
    const audio = document.getElementById('audio');
    const playPause = document.getElementById('playPause');
    const muteBtn = document.getElementById('muteBtn');
    const vol = document.getElementById('vol');
    const coverImg = document.getElementById('coverImg');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');

    audio.src = STREAM;
    audio.volume = parseFloat(vol.value);
    audio.autoplay = false;

    function setPlayingUI(playing){
      playPause.textContent = playing ? '⏸️ Pausar' : '⏯️ Reproducir';
    }

    // Inicializar el contexto de audio, pero estará suspendido hasta la interacción del usuario.
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let visualizerInitialized = false;

    async function togglePlay(){
      if(audio.paused){
        try{
          // Reanudar el contexto de audio si está suspendido (crucial para iOS)
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          await audio.play();
          setPlayingUI(true);
          // Inicializar el contexto de audio en la primera interacción del usuario
          if (!visualizerInitialized) {
            initAudioVisualizer();
            visualizerInitialized = true;
          }
        } catch(e) {
          console.warn('Autoplay bloqueado:', e); setPlayingUI(false);
        }
      } else { audio.pause(); setPlayingUI(false); }
    }

    playPause.addEventListener('click', ()=>{ togglePlay(); audio.muted=false; });
    muteBtn.addEventListener('click', ()=>{ audio.muted=!audio.muted; muteBtn.textContent=audio.muted?'🔇':'🔊'; });
    vol.addEventListener('input', ()=>{ audio.volume=parseFloat(vol.value); });

    function startPlayback() {
      if (audio.paused) {
        audio.muted = false;
        togglePlay();
      }
    }

    async function tryAutoplay(){
      audio.muted = true;
      try{
        await audio.play();
        setPlayingUI(true);
        // Si el autoplay funciona, también intentamos iniciar el visualizador
        if (!visualizerInitialized && audioCtx.state !== 'suspended') {
          initAudioVisualizer();
          visualizerInitialized = true;
        }
        setTimeout(()=>{ audio.muted=false; muteBtn.textContent='🔊'; },700);
      }catch(e){
        console.warn('Autoplay blocked by browser.', e);
        setPlayingUI(false);
        playPause.textContent = '▶️ Toca para Escuchar';
      }
    }

    let reconnectTimer=null;
    function scheduleReconnect(){
      if(reconnectTimer) return;
      reconnectTimer = setInterval(async ()=>{
        try{ audio.load(); await audio.play(); clearInterval(reconnectTimer); reconnectTimer=null; setPlayingUI(true); }
        catch(e){}
      },6000);
    }
    audio.addEventListener('error', scheduleReconnect);
    audio.addEventListener('stalled', scheduleReconnect);
    audio.addEventListener('ended', scheduleReconnect);

    function splitArtistTitle(raw){
      if(!raw) return { artist:'', title:'' };
      raw = raw.replace(/\u0000/g,'').trim();
      if(raw.includes(' - ')){
        const parts=raw.split(' - ');
        return { artist:parts[0].trim(), title:parts.slice(1).join(' - ').trim() };
      }
      return { artist:'', title:raw };
    }

    async function fetchItunesArtwork(artist,title){
      try{
        const q = encodeURIComponent(`${artist} ${title}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
        if(!res.ok) return null;
        const j = await res.json();
        if(j.resultCount && j.results[0]?.artworkUrl100){
          return j.results[0].artworkUrl100.replace('100x100bb.jpg','600x600bb.jpg');
        }
      }catch(err){ console.warn('iTunes lookup failed',err); }
      return null;
    }

    function setupMetadataListener() {
      const eventSource = new EventSource(ZENO_META);

      eventSource.onmessage = async (event) => {
        try {
          const j = JSON.parse(event.data);
          const raw = j?.streamTitle || 'Transmitiendo en vivo';
          const parsed = splitArtistTitle(raw);

          // Actualizar el título de la página
          if (parsed.artist && parsed.title && parsed.title !== 'Transmitiendo en vivo') {
            document.title = `${parsed.artist} - ${parsed.title}`;
          } else if (parsed.title && parsed.title !== 'Transmitiendo en vivo') {
            document.title = parsed.title;
          } else {
            document.title = 'La 87, La Primera - 87.7 FM';
          }

          // Marquee dinámico
          songTitle.textContent = parsed.title;
          songTitle.classList.remove('marquee');
          // Use requestAnimationFrame for smoother UI updates
          requestAnimationFrame(() => {
            if (songTitle.scrollWidth > songTitle.clientWidth) {
              songTitle.innerHTML = `<span>${parsed.title}</span>`;
              songTitle.classList.add('marquee');
            }
          });

          songArtist.textContent = parsed.artist || 'La 87, La Primera';

          // Artwork con fade
          let art = j?.artwork || j?.image || null;
          if (!art) art = await fetchItunesArtwork(parsed.artist, parsed.title);
          const newArt = art || 'https://www.la87hn.com/assets/laprimera_logo_trans512.png';
          if (coverImg.src !== newArt) {
            coverImg.classList.add('fade-out');
            setTimeout(() => { coverImg.src = newArt; coverImg.classList.remove('fade-out'); }, 700);
          }
        } catch (err) {
          console.warn('Failed to process metadata event', err);
        }
      };

      eventSource.onerror = (err) => {
        console.error('EventSource failed:', err);
        // The browser will automatically try to reconnect.
        // You could add custom logic here if needed.
      };
    }

    function initAudioVisualizer() {
      const analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      analyser.fftSize = 256;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      const canvas = document.getElementById('visualizer');
      const canvasCtx = canvas.getContext('2d');

      function draw() {
        requestAnimationFrame(draw);

        analyser.getByteFrequencyData(dataArray);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 1.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = dataArray[i] * 1.5; // Aumenta la altura de las barras

          // Dibuja las barras con un degradado sutil
          const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
          gradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
          gradient.addColorStop(1, 'rgba(255, 255, 255, 0.3)');
          canvasCtx.fillStyle = gradient;
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

          x += barWidth + 2; // Añade un pequeño espacio entre barras
        }
      }
      draw();
    }

    setupMetadataListener();

    document.getElementById('copyright-year').textContent = new Date().getFullYear();

    window.addEventListener('load', ()=>{ tryAutoplay(); });

  })();
  </script>
</body>
</html>
