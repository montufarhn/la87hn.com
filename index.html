<div id="radiosplay-player-68dbebd42c8e4"></div>
<script>
(function() {
    var playerContainer = document.getElementById('radiosplay-player-68dbebd42c8e4');
    if (!playerContainer) { console.error('Player container not found.'); return; }

    var isFixed = true;
    
    if (isFixed) {
        playerContainer.style.position = 'fixed';
        playerContainer.style.bottom = '0';
        playerContainer.style.left = '0';
        playerContainer.style.width = '100%';
        playerContainer.style.height = '75px';
        playerContainer.style.zIndex = '999';
    } else {
        playerContainer.style.position = 'relative';
        playerContainer.style.width = '100%';
        playerContainer.style.height = '75px';
    }

    var hosts = ['https://radiosplay.com.ar/player-gratis', 'https://radiosplay.top/player-gratis'];
    var playerParams = 'panel=zenoradio&stream=https%3A%2F%2Fstream.zeno.fm%2Ftr4u2w53sxhvv&nombre=La+87%2C+La+Primera&logo=https%3A%2F%2Fwww.la87hn.com%2Fassets%2Flaprimera_logo_trans512.png&bgcolor=%231e1e1e&textcolor=%23ffffff&social_fb=https%3A%2F%2Fwww.facebook.com%2Fla87laprimera&social_ig=https%3A%2F%2Fwww.instagram.com%2Fla87laprimera%2F&social_tk=&social_x=https%3A%2F%2Fx.com%2Fla87fm&social_yt=&social_wa=50432639354&social_twitch=&social_discord=&social_soundcloud=&custom_link_url=https%3A%2F%2Ftunein.com%2Fradio%2FLa-87-La-Primera-s346424%2F&custom_link_icon=tunein&social_color=%23ffffff&social_align=center&app_android=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.la87hn.la87laprimera%26amp%3Bhl%3Des&app_iphone=&app_windows=&app_align=right&app_android_restrict=0&app_iphone_restrict=0&app_windows_restrict=0&show_title=1&show_cover=1&show_volume=1&autoplay=1&fijar=1&branding_text=%C2%A9+Xatrcuh+Tech&azuracast_stub=&bgimg=https%3A%2F%2Fradiosplay.com.ar%2Fplayer-gratis%2Ffondos%2Ffondo_68bb4db0867a11.64450089.jpg&bgsize=cover&bgpos=center+center';
    var loaded = false;

    function createIframe(src) {
        var iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay');
        iframe.setAttribute('scrolling', 'no');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        playerContainer.innerHTML = '';
        playerContainer.appendChild(iframe);
        loaded = true;
    }

    function checkHost(index) {
        if (index >= hosts.length || loaded) {
            if (!loaded) playerContainer.innerHTML = 'Error: No se pudo cargar el reproductor desde los servidores disponibles.';
            return;
        }
        var host = hosts[index];
        var testUrl = host + '/play.png?t=' + new Date().getTime();
        var controller = new AbortController();
        var timeoutId = setTimeout(function() { controller.abort(); }, 4000);

        fetch(testUrl, { signal: controller.signal, mode: 'no-cors', cache: 'no-store' })
        .then(function() {
            clearTimeout(timeoutId);
            if(loaded) return;
            var playerUrl = host + '/reproductor.php?' + playerParams;
            createIframe(playerUrl);
        })
        .catch(function() {
            clearTimeout(timeoutId);
            console.warn('Host ' + host + ' fallido. Probando el siguiente...');
            checkHost(index + 1);
        });
    }
    checkHost(0);
})();
</script>
