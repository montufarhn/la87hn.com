<body>

  </script>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  <script>
    /* CONFIG */
    const CONFIG = {
      streamUrl: 'https://stream.zeno.fm/tr4u2w53sxhvv',
      sponsors: [
        'https://www.la87hn.com/assets/sponsors/patrocinador2.png',
        'https://www.la87hn.com/assets/sponsors/patrocinador3.png',
        'https://www.la87hn.com/assets/sponsors/patrocinador7.png'
      ],
      logoUrl: 'https://www.la87hn.com/assets/laprimera_logo_trans512.png',
      metadataCandidates: [
        // common ICY/JSON endpoints to try (best-effort)
        'https://stream.zeno.fm/tr4u2w53sxhvv',
        'https://stream.zeno.fm/status-json.xsl',
        'https://stream.zeno.fm/tr4u2w53sxhvv/status-json.xsl'
      ],
      metadataPollSec: 12
    };

    // Elements
    const audio = document.getElementById('audio-player');
    const titleEl = document.getElementById('song-title');
    const albumArt = document.getElementById('album-art');
    const brandLogo = document.getElementById('brandLogo');

    // Apply branding
    brandLogo.src = CONFIG.logoUrl;

    // Sponsors carousel render
    const carouselInner = document.querySelector('#sponsorCarousel .carousel-inner');
    carouselInner.innerHTML = '';
    CONFIG.sponsors.forEach((src, idx) => {
      const item = document.createElement('div');
      item.className = 'carousel-item' + (idx === 0 ? ' active' : '');
      const img = document.createElement('img');
      img.src = src; img.className = 'd-block mx-auto'; img.alt = `Patrocinador ${idx+1}`;
      item.appendChild(img);
      carouselInner.appendChild(item);
    });

    // Autoplay strategy: attempt muted autoplay first (max compatibility), then unmute on user gesture or after short time
    async function tryAutoplay(){
      try{
        audio.muted = true; // increases browser autoplay acceptance
        await audio.play();
        // temporarily unmute (may be blocked); if it fails, remain muted until user interacts
        setTimeout(() => { audio.muted = false; }, 800);
      }catch(e){
        console.warn('Autoplay blocked, waiting user interaction.', e);
      }
    }

    // Metadata polling: try multiple strategies to extract a title
    async function probeMetadata(){
      // 1) Attempt endpoints that often return Icecast/SHOUTcast JSON
      for(const url of CONFIG.metadataCandidates){
        try{
          const res = await fetch(url, {cache:'no-store', mode:'cors'});
          if(!res.ok) continue;
          const ct = res.headers.get('content-type') || '';
          if(ct.includes('application/json') || ct.includes('text/json')){
            const j = await res.json();
            // try different common structures
            if(j.icestats && j.icestats.source){
              const src = Array.isArray(j.icestats.source)? j.icestats.source[0] : j.icestats.source;
              const title = src.title || src.song || src.NowPlaying || '';
              if(title) return parseTitleArtist(title);
            }
          }
          // fallback: text search for StreamTitle='...'
          const txt = await res.text();
          const m = txt.match(/StreamTitle='([^']+)'/i) || txt.match(/<title>([^<]+)<\/title>/i);
          if(m && m[1]) return parseTitleArtist(m[1]);
        }catch(err){ /* ignore and continue */ }
      }

      // 2) As last resort, try to read media tags using Media Session API (if available) while playing
      if('mediaSession' in navigator && navigator.mediaSession.metadata){
        const meta = navigator.mediaSession.metadata;
        if(meta.title) return { title: meta.title, artist: meta.artist || '' };
      }

      return null;
    }

    function parseTitleArtist(raw){
      // common formats: "Artist - Title" or "Title - Artist"; try both
      let title = raw; let artist = '';
      if(raw.includes(' - ')){
        const parts = raw.split(' - ');
        // heuristics: if first part contains numbers or 'ft.' assume Artist-Title else Title-Artist
        if(parts[0].length < 40 && parts[1].length < 60){
          // prefer Artist - Title
          artist = parts[0]; title = parts.slice(1).join(' - ');
        } else { title = raw; }
      }
      return { title: title.trim(), artist: (artist||'').trim() };
    }

    // iTunes search to fetch artwork
    async function fetchItunesArt(artist, title){
      try{
        const q = encodeURIComponent(`${artist} ${title}`.trim());
        const url = `https://itunes.apple.com/search?term=${q}&entity=song&limit=1`;
        const res = await fetch(url);
        if(!res.ok) return null;
        const j = await res.json();
        if(j.resultCount && j.results && j.results[0]){
          // artworkUrl100 -> replace 100x100 with 600x600
          const art = j.results[0].artworkUrl100;
          return art ? art.replace('100x100bb.jpg', '600x600bb.jpg') : null;
        }
        return null;
      }catch(e){ return null; }
    }

    // Update UI given metadata
    async function updateNowPlaying(){
      const meta = await probeMetadata();
      if(meta){
        titleEl.textContent = meta.title + (meta.artist ? ' — ' + meta.artist : '');
        // try itunes for artwork
        const art = await fetchItunesArt(meta.artist, meta.title);
        if(art) albumArt.src = art; else albumArt.src = CONFIG.logoUrl;
      } else {
        titleEl.textContent = 'Transmitiendo en vivo — La 87, La Primera 87.7 FM';
        albumArt.src = CONFIG.logoUrl;
      }
    }

    // Start polling metadata
    updateNowPlaying();
    setInterval(updateNowPlaying, CONFIG.metadataPollSec * 1000);

    // Wire user gesture to unmute if autoplay blocked
    document.addEventListener('click', ()=>{ if(audio.paused) audio.play().catch(()=>{}); audio.muted=false; });

    // Initial autoplay attempt
    tryAutoplay();

  </script></body>
